# Harness pipeline for the azure-devops-project
# Keep pipelines/azure-pipelines.yml unchanged; it belongs to Azure DevOps.
# Replace the Harness organization/project identifiers below before use.
# This starter pipeline validates Terraform and creates a plan; it does NOT run apply.

pipeline:
  name: Azure DevOps Project - Terraform Check
  identifier: Azure_DevOps_Project_Terraform_Check
  projectIdentifier: YOUR_HARNESS_PROJECT_ID
  orgIdentifier: YOUR_HARNESS_ORG_ID
  tags: {}
  stages:
    - stage:
        name: Terraform Validate and Plan
        identifier: Terraform_Validate_and_Plan
        description: Initialize Terraform, validate the configuration, and create a plan.
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: Run
                  name: Check Tool Versions
                  identifier: Check_Tool_Versions
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      git --version
                      terraform version
              - step:
                  type: Run
                  name: Terraform Init
                  identifier: Terraform_Init
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      cd azure-devops-project/infra
                      terraform init
              - step:
                  type: Run
                  name: Terraform Format Check
                  identifier: Terraform_Format_Check
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      cd azure-devops-project/infra
                      terraform fmt -check -recursive
              - step:
                  type: Run
                  name: Terraform Validate
                  identifier: Terraform_Validate
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      cd azure-devops-project/infra
                      terraform validate
              - step:
                  type: Run
                  name: Terraform Plan
                  identifier: Terraform_Plan
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      cd azure-devops-project/infra
                      terraform plan -input=false -out=tfplan

# Before execution:
# - Configure Harness CI build infrastructure and the Terraform version.
# - Configure Azure authentication through Harness secrets/connector; never hardcode secrets.
# - Ensure Terraform state is safely stored remotely and accessible to this pipeline.
# - Do not add terraform apply until the state and plan have been reviewed.
