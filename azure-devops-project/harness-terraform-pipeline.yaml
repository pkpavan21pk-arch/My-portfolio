
pipeline:
  stages:
    - name: Cleanup Azure Resources
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - run:
            script: |-
              set -eu

              echo "Step 1: Install Azure CLI"
              apt-get update
              apt-get install -y azure-cli

              echo "Step 2: Configure Azure credentials"
              export ARM_CLIENT_ID="bb4283e0-42db-4cf5-969c-55d4c18f802f"
              export ARM_TENANT_ID="aea8d035-0629-4c0a-bb73-16ec83172238"
              export ARM_SUBSCRIPTION_ID="171a17a7-9dc3-406d-878e-b33aee0551a2"
              export ARM_CLIENT_SECRET='<+secrets.getValue("secret_3fbe")>'

              : "${ARM_CLIENT_SECRET:?Azure client secret is missing}"

              echo "Step 3: Login to Azure"
              az login \
                --service-principal \
                --username "$ARM_CLIENT_ID" \
                --password "$ARM_CLIENT_SECRET" \
                --tenant "$ARM_TENANT_ID" \
                --output none

              az account set --subscription "$ARM_SUBSCRIPTION_ID"

              echo "Step 4: Verify target resource group"
              RESOURCE_GROUP="rg-devops-demo"

              az group show \
                --name "$RESOURCE_GROUP" \
                --query "{name:name, location:location}" \
                --output table

              echo "Step 5: Delete resource group"
              az group delete \
                --name "$RESOURCE_GROUP" \
                --yes \
                --no-wait

              echo "Deletion requested. Checking completion..."

              az group wait \
                --name "$RESOURCE_GROUP" \
                --deleted

              echo "Cleanup completed: resource group deleted."
  inputs:
    azure:
      type: connector
      required: true
      default: connector_Azure_bde8
