
pipeline:
  stages:
    - name: terraform-validation
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - run:
            script: |
              set -e
              echo "Checking Terraform configuration"
              terraform version

        - run:
            script: |
              set -e
              echo "Checking Terraform files"
              pwd
              ls -la
              find . -maxdepth 5 -type f -name "*.tf"
