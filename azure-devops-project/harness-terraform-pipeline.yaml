pipeline:
  stages:
    - name: Terraform Validate
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - run:
            script: |
              set -eu

              echo "Checking out repository files"
              echo "Current directory:"
              pwd
              echo "Available files:"
              ls -la

              echo "Checking Terraform directory"
              cd /harness/azure-devops-project/infra

              echo "Installing required tools"
              apt-get update
              apt-get install -y curl unzip

              TERRAFORM_VERSION="1.16.5"
              curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
              unzip -o /tmp/terraform.zip -d /usr/local/bin

              echo "Terraform version"
              terraform version

              echo "Formatting check"
              terraform fmt -check -recursive

              echo "Initializing Terraform"
              terraform init -backend=false -input=false

              echo "Validating Terraform"
              terraform validate
