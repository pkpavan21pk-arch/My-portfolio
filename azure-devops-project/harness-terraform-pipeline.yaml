
pipeline:
  stages:
    - name: terraform-workspace-check
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - run:
            script: |
              set -e
              echo "Checking workspace"
              pwd
              ls -la

        - run:
            script: |
              set -e
              echo "Searching for Terraform files"
              find . -maxdepth 6 -type f \( -name "main.tf" -o -name "providers.tf" -o -name "variables.tf" \)
