
pipeline:
  stages:
    - name: terraform-check
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - run:
            script: |
              set -e
              echo "Checking available tools"
              git --version
              terraform version

        - run:
            script: |
              set -e
              echo "Checking repository workspace"
              pwd
              ls -la
              find . -maxdepth 4 -type f -name "*.tf"


