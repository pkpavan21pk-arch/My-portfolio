trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'pavan-test'
  resourceGroup: 'rg-devops-demo'
  acrName: 'pavandevopsacr20261015'
  aksCluster: 'aks-devops-demo'
  imageName: 'nginx-app'
  imageTag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build and Push Image
    jobs:
      - job: BuildImage
        displayName: Build NGINX Image in ACR
        steps:
          - task: AzureCLI@2
            displayName: Build and Push to ACR
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(imageName):$(imageTag)" \
                  --file azure-devops-project/app/Dockerfile \
                  azure-devops-project/app

  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: Build
    jobs:
      - job: DeployApp
        displayName: Deploy NGINX
        steps:
          - task: AzureCLI@2
            displayName: Deploy to Kubernetes
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group "$(resourceGroup)" \
                  --name "$(aksCluster)" \
                  --overwrite-existing

                sed "s|IMAGE_PLACEHOLDER|$(acrName).azurecr.io/$(imageName):$(imageTag)|g" \
                  azure-devops-project/k8s/deployment.yaml \
                  > "$(Agent.TempDirectory)/deployment.yaml"

                kubectl apply -f "$(Agent.TempDirectory)/deployment.yaml"
                kubectl apply -f azure-devops-project/k8s/service.yaml
                kubectl rollout status deployment/nginx-app --timeout=180s
